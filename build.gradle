plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Default run configurations.
// 客户端/专服集成夹具独立成源集，不进入发布 JAR，不能由 main 反向依赖。
// Isolated client and dedicated-server integration harnesses, excluded from the shipped JAR and never a main dependency.
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// 本地回归/诊断由 tests/run.ps1 分组，CI 仍走 Gradle build；拒绝旧参数以防静默启动普通游戏。
// tests/run.ps1 dispatches local regression/diagnostic groups; CI keeps Gradle build.
// Reject retired selectors:
// Gradle otherwise silently accepts unknown -P properties and starts a normal game.
def retiredTestSelectors = ['m3Smoke', 'm4Smoke', 'm47Smoke', 'preM5Only', 'stage7ConfirmAudit', 'witnessTiming']
def suppliedRetiredSelectors = retiredTestSelectors.findAll { project.hasProperty(it) }
if (suppliedRetiredSelectors)
    throw new GradleException("Retired test selectors: ${suppliedRetiredSelectors.join(', ')}. Use tests/run.ps1; see tests/README.md for the migration map.")

def craftableClientSuite = project.findProperty('craftableClientSuite')?.toString()
def craftableClientDiagnostic = project.findProperty('craftableClientDiagnostic')?.toString()
if (project.hasProperty('craftableClientSuite') && !(craftableClientSuite in ['inventory', 'planning', 'settings']))
    throw new GradleException('craftableClientSuite must be inventory, planning, or settings.')
if (!project.hasProperty('craftableClientDiagnostic')) craftableClientDiagnostic = 'none'
if (!(craftableClientDiagnostic in ['none', 'lease', 'timing']) || craftableClientDiagnostic != 'none' && craftableClientSuite != 'planning')
    throw new GradleException('Client diagnostics require the planning suite and must be lease or timing.')
def craftableClientRun = craftableClientSuite ? java.util.UUID.randomUUID().toString() : null
def craftableKnowledgePhase = project.findProperty('craftableKnowledgePhase')?.toString()
if (project.hasProperty('craftableKnowledgePhase') && !(craftableKnowledgePhase in ['warmup', 'restart']))
    throw new GradleException('craftableKnowledgePhase must be warmup or restart.')
def craftableKnowledgeExpectedCache = project.findProperty('craftableKnowledgeExpectedCache')?.toString()
if (project.hasProperty('craftableKnowledgeExpectedCache') && craftableKnowledgePhase != 'restart'
        || craftableKnowledgePhase == 'restart' && !(craftableKnowledgeExpectedCache ==~ /[0-9a-f]{64}/))
    throw new GradleException('Knowledge restart requires the SHA-256 of this test group\'s warmup cache; other phases must not supply it.')
def craftableKnowledgeRun = craftableKnowledgePhase ? java.util.UUID.randomUUID().toString() : null
def craftableKnowledgeCache = layout.projectDirectory.file('run/knowledgeServerSmoke/craftable-knowledge-smoke/craftable/cache/recipe-knowledge-v1.json').asFile

// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
        if (craftableClientSuite) {
            modSource project.sourceSets.integrationTest
            systemProperty 'craftable.clientTestSuite', craftableClientSuite
            systemProperty 'craftable.clientTestDiagnostic', craftableClientDiagnostic
            systemProperty 'craftable.clientTestRun', craftableClientRun
            if (craftableClientDiagnostic == 'timing') systemProperty 'craftable.witnessTiming', 'true'
        }
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
        if (craftableKnowledgePhase) {
            modSource project.sourceSets.integrationTest
            systemProperty 'craftable.knowledgePhase', craftableKnowledgePhase
            systemProperty 'craftable.knowledgeRun', craftableKnowledgeRun
            arguments.addAll '--universe', project.layout.projectDirectory.dir('run/knowledgeServerSmoke').asFile.absolutePath,
                    '--world', 'craftable-knowledge-smoke', '--port', '25585'
        }
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        // GameTest 复用原版空结构，不为夹具向产品资源新增仅测试使用的 NBT。
        // GameTests reuse Mojang's empty structure template; production resources do
        // not gain a test-only NBT file solely to host server-backed tests.
        systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// NeoGradle tracks the shared asset directory as one task output. If a previous
// download was interrupted, rerunning the task can remove otherwise valid
// assets before attempting the download again. Preserve a cache that is already
// complete according to Mojang's asset index; incomplete caches still use the
// normal NeoGradle download path.
def craftableAssetsRoot = new File(gradle.gradleUserHomeDir, 'caches/minecraft/assets')
def craftableAssetIndex = new File(craftableAssetsRoot, 'indexes/asset-index.json')
def craftableMinecraftAssetsComplete = false
if (craftableAssetIndex.isFile()) {
    try {
        def objects = new groovy.json.JsonSlurper().parse(craftableAssetIndex).objects
        craftableMinecraftAssetsComplete = objects && objects.values().every { entry ->
            def hash = entry.hash as String
            def objectFile = new File(craftableAssetsRoot, "objects/${hash.substring(0, 2)}/${hash}")
            objectFile.isFile() && objectFile.length() == (entry.size as long)
        }
    } catch (Exception ignored) {
        craftableMinecraftAssetsComplete = false
    }
}

tasks.matching { it.name.endsWith('DownloadAssets') }.configureEach {
    enabled = !craftableMinecraftAssetsComplete
}

// 即使 --rerun-tasks 也不丢弃已验证的 Mojang 文件并换成不完整下载；缺失/无效时仍启用正常下载任务。
// --rerun-tasks must not discard verified Mojang version files and replace
// them with a partial network response. Invalid or missing files leave the
// corresponding NeoGradle download task enabled.
def craftableVersionCache = new File(projectDir, ".gradle/caches/minecraft/versions/${minecraft_version}")
def craftableVersionMetadata = new File(craftableVersionCache, 'metadata.json')
def craftableVerifiedVersionTasks = [:]
if (craftableVersionMetadata.isFile()) {
    try {
        def downloads = new groovy.json.JsonSlurper().parse(craftableVersionMetadata).downloads
        def candidates = [
                "cacheVersionExecutableClient${minecraft_version}": ['client.jar', downloads.client],
                "cacheVersionExecutableServer${minecraft_version}": ['server.jar', downloads.server],
                "cacheVersionMappingsClient${minecraft_version}"  : ['client.txt', downloads.client_mappings],
                "cacheVersionMappingsServer${minecraft_version}"  : ['server.txt', downloads.server_mappings],
        ]
        candidates.each { taskName, candidate ->
            def cachedFile = new File(craftableVersionCache, candidate[0] as String)
            def expected = candidate[1]
            if (cachedFile.isFile() && cachedFile.length() == (expected.size as long)) {
                def digest = java.security.MessageDigest.getInstance('SHA-1')
                cachedFile.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                        digest.update(buffer, 0, read)
                    }
                }
                craftableVerifiedVersionTasks[taskName] =
                        digest.digest().encodeHex().toString().equalsIgnoreCase(expected.sha1 as String)
            }
        }
    } catch (Exception ignored) {
        craftableVerifiedVersionTasks.clear()
    }
}

tasks.matching { craftableVerifiedVersionTasks.containsKey(it.name) }.configureEach {
    enabled = !craftableVerifiedVersionTasks[name]
}

// 启动前归档旧日志；启动或加载失败未产生新日志时，历史 PASS 不能满足本次任务。
// Preserve the previous log before launching a harness. If launch/loader
// failure creates no new log, a historical PASS cannot satisfy this task.
def archiveHarnessLog = { File log, String name ->
    if (log.isFile()) {
        def archive = new File(projectDir, "run/verification/previous-${name}-${java.util.UUID.randomUUID()}")
        if (!archive.mkdirs()) throw new GradleException("Cannot archive previous harness log: ${archive}")
        java.nio.file.Files.move(log.toPath(), new File(archive, 'latest.log').toPath())
        logger.lifecycle("Previous harness log archived: ${archive}")
    }
}

if (craftableClientSuite) {
    def clientLog = layout.projectDirectory.file('run/client/logs/latest.log').asFile
    def scope = "suite=${craftableClientSuite} diagnostic=${craftableClientDiagnostic} run=${craftableClientRun}"
    tasks.matching { it.name == 'runClient' }.configureEach {
        notCompatibleWithConfigurationCache('Client tests require a new per-invocation run ID and fresh harness log.')
        doFirst { archiveHarnessLog(clientLog, 'client') }
        doLast {
            def result = clientLog.isFile() ? clientLog.getText('UTF-8') : ''
            def start = "CLIENT_TEST START ${scope}"
            def pass = "CLIENT_TEST PASS ${scope}"
            def lines = result.readLines()
            boolean matching = lines.count { it.endsWith(start) } == 1 && lines.count { it.contains('CLIENT_TEST START ') } == 1 &&
                    lines.count { it.endsWith(pass) } == 1 && lines.count { it.contains('CLIENT_TEST PASS ') } == 1 &&
                    result.indexOf(pass) > result.indexOf(start)
            boolean failed = (result =~ /(?:CLIENT_TEST|INVENTORY_SMOKE|PLANNING_SMOKE|CLIENT_SETTINGS|CLIENT_DIAGNOSTIC) FAIL\b/).find()
            boolean falseFull = (craftableClientSuite != 'planning' || craftableClientDiagnostic != 'none') && result.contains('PLANNING_SMOKE PASS:')
            if (!matching || failed || falseFull)
                throw new GradleException("Client ${craftableClientSuite}/${craftableClientDiagnostic} did not pass this run; inspect ${clientLog}")
        }
    }
}

if (craftableKnowledgePhase) {
    def knowledgeSmokeLog = layout.projectDirectory.file('run/server/logs/latest.log').asFile
    def scope = "phase=${craftableKnowledgePhase} run=${craftableKnowledgeRun}"
    tasks.matching { it.name == 'runServer' }.configureEach {
        notCompatibleWithConfigurationCache('Harness logs must be archived before each knowledge process.')
        doFirst {
            archiveHarnessLog(knowledgeSmokeLog, 'knowledge')
            if (craftableKnowledgePhase == 'restart') {
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                if (craftableKnowledgeCache.isFile()) craftableKnowledgeCache.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    for (int count = input.read(buffer); count != -1; count = input.read(buffer)) digest.update(buffer, 0, count)
                }
                def hash = craftableKnowledgeCache.isFile() ? digest.digest().encodeHex().toString() : null
                if (hash != craftableKnowledgeExpectedCache)
                    throw new GradleException('Knowledge restart cache differs from this test group\'s warmup output.')
            }
        }
        doLast {
            def result = knowledgeSmokeLog.isFile() ? knowledgeSmokeLog.getText('UTF-8') : ''
            def start = "KNOWLEDGE_TEST START ${scope}"
            def pass = "KNOWLEDGE_TEST PASS ${scope}"
            def lines = result.readLines()
            boolean matching = lines.count { it.endsWith(start) } == 1 && lines.count { it.contains('KNOWLEDGE_TEST START ') } == 1 &&
                    lines.count { it.endsWith(pass) } == 1 && lines.count { it.contains('KNOWLEDGE_TEST PASS ') } == 1 &&
                    result.indexOf(pass) > result.indexOf(start)
            boolean saved = matching && (result.substring(result.indexOf(pass)) =~ /Craftable knowledge: saved keys=[1-9]\d* bytes=[1-9]\d*/).find() &&
                    craftableKnowledgeCache.isFile() && craftableKnowledgeCache.length() > 0
            boolean failed = (result =~ /(?:KNOWLEDGE_TEST|KNOWLEDGE_SERVER_SMOKE) FAIL\b/).find()
            if (!matching || !saved || failed)
                throw new GradleException("Knowledge ${craftableKnowledgePhase} did not pass and save this run; inspect ${knowledgeSmokeLog}")
        }
    }
}

// 加载器失败也可能以 0 退出，必须验证本次 GameTest 真实完成标记，不能只看进程成功。
// A loader failure can also exit the game server with zero. Require the actual
// GameTest completion marker, not merely successful process termination.
def craftableGameTestLog = layout.projectDirectory.file('run/gameTestServer/logs/latest.log').asFile
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    notCompatibleWithConfigurationCache('Harness logs must be archived before each GameTest process.')
    doFirst { archiveHarnessLog(craftableGameTestLog, 'gametest') }
    doLast {
        def result = craftableGameTestLog.exists() ? craftableGameTestLog.getText('UTF-8') : ''
        if (!(result =~ /All \d+ required tests passed/).find()) {
            throw new GradleException('GameTest server did not pass; inspect run/gameTestServer/logs/latest.log')
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Specify the version of Minecraft to use.
    // Depending on the plugin applied there are several options. We will assume you applied the userdev plugin as shown above.
    // The group for userdev is net.neoforged, the module name is neoforge, and the version is the same as the neoforge version.
    // You can however also use the vanilla plugin (net.neoforged.gradle.vanilla) to use a version of Minecraft without the neoforge loader.
    // And its provides the option to then use net.minecraft as the group, and one of; client, server or joined as the module name, plus the game version as version.
    // For all intends and purposes: You can treat this dependency as if it is a normal library you would use.
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// 再分发的 JAR 随附英文许可及对应中文译文，不能只留下元数据中的许可名称。
// Ship the English license and corresponding Chinese translation, not only the metadata name.
tasks.named('jar', Jar).configure {
    from('LICENSE', 'LICENSE.zh-CN')
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
